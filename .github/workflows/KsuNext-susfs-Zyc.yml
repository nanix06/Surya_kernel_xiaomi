name: Surya-KSUNext-susfs-zyc

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "URL du boot.img a patcher"
        required: false
        default: "https://download.pixelos.net/seventeen/surya/recovery/boot-surya_20261028_1306.img"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/surya
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
  # ZyC Clang 23
  ZYC_CLANG_VERSION: "23.0.0git-20260130"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: seventeen
          fetch-depth: 1
          submodules: recursive

      - name: Télécharger le boot.img
        env:
          BOOT_URL: ${{ inputs.boot_url }}
        run: |
          # Téléchargé AVANT le build : une URL morte échoue vite.
          curl -fL --retry 3 --retry-delay 2 -o stock-boot.img "$BOOT_URL"
          echo "taille    : $(stat -c%s stock-boot.img) octets"
          test "$(head -c8 stock-boot.img)" = "ANDROID!" && echo "magic     : ANDROID!"

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip curl \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libncurses5 libtinfo5 libxml2

      # Clang 23 via build ZyC (clang + lld + binutils LLVM).
      - name: Installer ZyC Clang 23
        run: |
          URL="https://github.com/ZyCromerZ/Clang/releases/download/${ZYC_CLANG_VERSION}-release/Clang-${ZYC_CLANG_VERSION}.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o clang.tar.gz "$URL"

          mkdir -p clang

          top=$(tar -tzf clang.tar.gz | head -n1 | cut -d/ -f1)
          strip=0
          if tar -tzf clang.tar.gz | grep -qx "${top}/bin/clang"; then
            strip=1
          fi
          tar -xzf clang.tar.gz -C clang --strip-components="$strip"
          rm clang.tar.gz

          test -x clang/bin/clang || { echo "ERREUR: clang/bin/clang absent apres extraction"; exit 1; }
          test -x clang/bin/llvm-ar || { echo "ERREUR: llvm-ar absent (LLVM=1 en a besoin)"; exit 1; }
          clang/bin/clang --version
          clang/bin/ld.lld --version

          # PATH persistant pour toutes les etapes suivantes
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Télécharger et appliquer les patchs KernelSU et SuSFS
        run: |
          git clone --depth=1 -b main https://github.com/nanix06/Patch_Ksu_SuSFS.git patches
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksunext.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_nameic.patch || true
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_statc.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch || true
          # patch_ksu_path_umount.patch retire : path_umount() existe deja nativement
          # dans fs/namespace.c de cette branche (sinon "redefinition of 'path_umount'").
          # Securite : ne l'appliquer que si la fonction est absente.
          if ! grep -q '^int path_umount(struct path \*path, int flags)' fs/namespace.c; then
            patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksu_path_umount.patch || true
          fi
          sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
          sed -i '/^orig_flow:$/a\\t\t;' fs/notify/fdinfo.c
          sed -i '0,/^static void susfs_run_sus_path_loop(void) {/s//void susfs_run_sus_path_loop(void) {/' fs/susfs.c

      - name: Corriger l'injection initrc (hooks newfstat/fstat64 manquants)
        run: |
          # Patch fourni par le repo Patch_Ksu_SuSFS (clone dans patches/).
          FIX=patches/Patches/Fix/patch_ksu_initrc_newfstat.patch
          test -f "$FIX" || {
            echo "ERREUR: $FIX absent (repo Patch_Ksu_SuSFS incomplet)"
            exit 1
          }
          git apply --verbose "$FIX"

          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c
          echo "OK: hooks newfstat/fstat64 presents dans fs/stat.c"

      - name: Ajouter KernelSU-Next
        run: |
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu

          # Fix 4.14 monotonic boottime API in sulog
          sed -i 's/get_monotonic_boottime(&ts)/get_monotonic_boottime64(\&ts)/' KernelSU/kernel/sulog/event.c
          sed -i '/#include <linux\/uaccess.h>/a #include <linux/timekeeping.h>' KernelSU/kernel/sulog/event.c

          # Apply SuSFS patch for KernelSU-Next legacy (keep upstream sepolicy.c for flex_array policydb compat)
          cp patches/Patches/SuSFS_Ksu/susfs_patch_ksunext.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_patch_ksunext.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          # Évite l'échec de compilation du dtbo overlay surya (labels externes non résolus)
          if [ -f arch/arm64/boot/dts/qcom/Makefile ]; then
            sed -i 's|^dtbo-$(CONFIG_MACH_XIAOMI_SURYA) += surya-sdmmagpie-overlay.dtbo|# &|' arch/arm64/boot/dts/qcom/Makefile
            sed -i 's|^surya-sdmmagpie-overlay.dtbo-base := surya-sdmmagpie.dtb|# &|' arch/arm64/boot/dts/qcom/Makefile
          fi

          # PATH (ZyC Clang 23) deja injecte via GITHUB_PATH
          clang --version | head -n1
          ld.lld --version | head -n1

          mkdir -p out

          # Le repo fournit vendor/surya.config (fragment) mais pas vendor/surya_defconfig.
          # On génère .config en fusionnant la base sdmsteppe-perf avec le fragment surya.
          if [ -f "arch/arm64/configs/${DEFCONFIG}_defconfig" ]; then
            make O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
              LLVM=1 \
              LLVM_IAS=1 \
              "$DEFCONFIG"
          else
            ARCH=arm64 bash scripts/kconfig/merge_config.sh -m -O out \
              arch/arm64/configs/vendor/sdmsteppe-perf_defconfig \
              arch/arm64/configs/vendor/surya.config
            make O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
              LLVM=1 \
              LLVM_IAS=1 \
              olddefconfig
          fi

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-Stormbreaker"
          ./scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO

          # Evite le build cassé du compat vDSO avec LLVM
          ./scripts/config --file out/.config --disable CONFIG_COMPAT_VDSO

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            KCFLAGS="-Wno-visibility -Wno-unused-but-set-variable -Wno-int-conversion -Wno-fortify-source -Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=incompatible-function-pointer-types -Wno-error=return-mismatch -Wno-error=date-time -Wno-error -Wno-implicit-enum-enum-cast" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Générer le boot.img patché
        env:
          BOOT_URL: ${{ inputs.boot_url }}
        run: |
          test -f out/arch/arm64/boot/Image || { echo "ERREUR: out/arch/arm64/boot/Image absent"; exit 1; }
          grep -aq 'KernelSU' out/arch/arm64/boot/Image || { echo "ERREUR: KernelSU absent du noyau compile"; exit 1; }

          BOOT_OUT=release/boot-surya-KSUNext.img

          # Repack du boot : on remplace uniquement le kernel en conservant les autres sections
          # (support header v0-v2 et v3-v4). Choix auto du format kernel (Image/Image.gz/Image.gz-dtb)
          # selon le kernel présent dans le boot stock.
          python3 - stock-boot.img out "$BOOT_OUT" <<'PY'
          import hashlib, os, struct, sys

          src, outdir, dst = sys.argv[1], sys.argv[2], sys.argv[3]

          def pad(data, page):
              return data + b"\0" * ((-len(data)) % page)

          def u32(b, off):
              return struct.unpack_from("<I", b, off)[0]

          def pick_kernel(stock_kern, outdir):
              base = os.path.join(outdir, "arch/arm64/boot")
              cand = []
              if stock_kern[:2] == b"\x1f\x8b":
                  cand = ["Image.gz-dtb", "Image.gz", "Image"]
              elif stock_kern[0x38:0x3C] == b"ARM\x64":
                  cand = ["Image", "Image.gz-dtb", "Image.gz"]
              else:
                  cand = ["Image.gz-dtb", "Image.gz", "Image"]
              for name in cand:
                  p = os.path.join(base, name)
                  if os.path.exists(p):
                      return p, name
              sys.exit("Aucun binaire noyau trouve dans " + base)

          img = open(src, "rb").read()
          if img[:8] != b"ANDROID!":
              sys.exit("boot stock: magic ANDROID! absent")

          page = u32(img, 36) or 4096
          hv = u32(img, 40)

          if hv <= 2:
              ks = u32(img, 8); rs = u32(img, 16); ss = u32(img, 24)
              dtbo_s = u32(img, 1632) if hv >= 1 else 0
              dtbo_off = struct.unpack_from("<Q", img, 1636)[0] if hv >= 1 else 0
              dtb_s = u32(img, 1644) if hv >= 2 else 0
              hsz = u32(img, 1640) if hv >= 2 else (1632 if hv == 1 else 608)
              osv = u32(img, 44)

              k_off = page
              r_off = k_off + ((ks + page - 1)//page) * page
              s_off = r_off + ((rs + page - 1)//page) * page
              rec_off = dtbo_off if (hv >= 1 and dtbo_s > 0 and dtbo_off > 0) else s_off + ((ss + page - 1)//page) * page
              dtb_off = rec_off + (((dtbo_s + page - 1)//page) * page if hv >= 1 else 0)

              stock_kern = img[k_off:k_off+ks]
              kpath, kname = pick_kernel(stock_kern, outdir)
              kern = open(kpath, "rb").read()

              ramdisk = img[r_off:r_off+rs]
              second = img[s_off:s_off+ss]
              rec = img[rec_off:rec_off+dtbo_s] if hv >= 1 else b""
              dtb = img[dtb_off:dtb_off+dtb_s] if hv >= 2 else b""
              orig_end = max(k_off+((ks+page-1)//page)*page,
                             r_off+((rs+page-1)//page)*page,
                             s_off+((ss+page-1)//page)*page,
                             rec_off+((dtbo_s+page-1)//page)*page if hv >= 1 else 0,
                             dtb_off+((dtb_s+page-1)//page)*page if hv >= 2 else 0)
              tail = img[orig_end:]

              hdr = bytearray(img[:page])
              struct.pack_into("<I", hdr, 8, len(kern))
              struct.pack_into("<I", hdr, 16, len(ramdisk))
              struct.pack_into("<I", hdr, 24, len(second))
              if hv >= 1:
                  struct.pack_into("<I", hdr, 1632, len(rec))
                  # keep recovery_dtbo_offset layout consistent by rebuilding sequentially
                  new_rec_off = page + ((len(kern)+page-1)//page)*page + ((len(ramdisk)+page-1)//page)*page + ((len(second)+page-1)//page)*page
                  struct.pack_into("<Q", hdr, 1636, new_rec_off if len(rec) else 0)
              if hv >= 2:
                  struct.pack_into("<I", hdr, 1644, len(dtb))

              out = bytes(hdr)
              out += pad(kern, page)
              out += pad(ramdisk, page)
              out += pad(second, page)
              if hv >= 1:
                  out += pad(rec, page)
              if hv >= 2:
                  out += pad(dtb, page)
              out += tail

              open(dst, "wb").write(out)
              chk = open(dst, "rb").read()
              assert chk[:8] == b"ANDROID!" and u32(chk, 40) == hv and chk[page:page+len(kern)] == kern
              print("header   : v%d (header_size=%d, page=%d)  os_version=0x%08x" % (hv, hsz, page, osv))
              print("noyau    : %s %d o (stock %d o)" % (kname, len(kern), ks))
              print("ramdisk  : %d o | second: %d o | recovery_dtbo: %d o | dtb: %d o | tail: %d o" % (len(ramdisk), len(second), len(rec), len(dtb), len(tail)))
              print("image    : %d o (%.2f MiB)" % (len(chk), len(chk) / 1048576.0))
              print("sha256   : " + hashlib.sha256(chk).hexdigest())

          elif hv in (3, 4):
              hsz = u32(img, 20); ks = u32(img, 8); rs = u32(img, 12); osv = u32(img, 16)
              ram_off = page + ((ks + page - 1)//page)*page
              if ram_off + rs > len(img):
                  sys.exit("ramdisk hors image: header incoherent")
              ramdisk = img[ram_off:ram_off + rs]
              stock_kern = img[page:page+ks]
              kpath, kname = pick_kernel(stock_kern, outdir)
              kern = open(kpath, "rb").read()

              hdr = bytearray(img[:page])
              struct.pack_into("<I", hdr, 8, len(kern))
              struct.pack_into("<I", hdr, 12, len(ramdisk))
              if hv == 4:
                  struct.pack_into("<I", hdr, 1580, 0)

              new_ram_off = page + ((len(kern) + page - 1)//page)*page
              out = bytes(hdr) + pad(kern, page)[:new_ram_off-page] + ramdisk + b"\0" * ((-len(ramdisk)) % page)
              # simpler rebuild
              out = bytes(hdr) + pad(kern, page) + pad(ramdisk, page)
              open(dst, "wb").write(out)

              chk = open(dst, "rb").read()
              nks = u32(chk, 8); nrs = u32(chk, 12)
              assert chk[:8] == b"ANDROID!" and chk[page:page+nks] == kern
              print("header   : v%d (header_size=%d, page=%d)  os_version=0x%08x" % (hv, hsz, page, osv))
              print("noyau    : %s %d o (stock %d o)" % (kname, len(kern), ks))
              print("ramdisk  : %d o (inchange)" % nrs)
              print("image    : %d o (%.2f MiB)" % (len(chk), len(chk) / 1048576.0))
              print("sha256   : " + hashlib.sha256(chk).hexdigest())
          else:
              sys.exit("header_version %d non gere" % hv)
          PY

          cd release
          sha256sum $(ls -1 | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS

          {
            echo "### boot.img patché"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ROM source | $BOOT_URL |"
            echo "| fichier | \`boot-surya-KSUNext.img\` |"
            echo "| taille | $(stat -c%s boot-surya-KSUNext.img) octets |"
            echo "| sha256 | \`$(sha256sum boot-surya-KSUNext.img | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-KernelSUNext
          path: release/
          if-no-files-found: error
